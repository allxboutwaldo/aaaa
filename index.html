  <style>
    :root{
      --bg: #000;
      --card-bg: rgba(255,255,255,0.06);
      --card-blur: 10px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;

      background-size: cover;
      color:#fff;

    /* ENTER SCREEN */
    #enterScreen {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      display:flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index:9999;
    }

    #enterScreen img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 20px #555454, 0 0 40px #555454, 0 0 60px #181717;
      transition: transform 0.3s ease;
      cursor:pointer;
    }

    #enterScreen img:hover { transform: scale(1.05); }

    #enterScreen .enter-text {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #3a3939;
      text-shadow: 0 0 8px #555454, 0 0 16px #181717;
      cursor: pointer;
    }

    /* Logo */
    .logo{
      display:block;
      margin: 32px auto 50px;
      width:300px;
      height:300px;
      object-fit:contain;
      transition: transform .25s ease;
    }
    .logo:hover{ transform: scale(1.08); }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .logo {
        width: 200px;
        height: 200px;
        margin: 20px auto 30px;
      }

      h2 {
        font-size: 24px;
      }

      .profile-container {
        padding: 20px;
        max-width: 100%;
        gap: 15px;
      }

      .profile {
        --size: 80px;
      }

      .profile-container div[style*="display:flex; gap:20px"] {
        gap: 15px;
      }

      img[style*="width: 800px"] {
        width: 100% !important;
        height: auto !important;
        max-width: 400px;
      }

      video {
        width: 100% !important;
        max-width: 400px;
        height: auto;
      }

      #volumeControl {
        top: 10px;
        left: 10px;
        padding: 4px 8px;
      }

      #volumeSlider {
        width: 80px;
      }

      #muteBtn {
        font-size: 16px;
      }

      .enter-text {
        font-size: 18px;
      }

      #enterScreen img {
        width: 150px;
        height: 150px;
      }
    }

    h2{
      margin:0 0 28px;
      font-size:30px;
      font-weight:700;
      background: linear-gradient(to right,#fff,#000,#fff);
      background-size:1000% 100%;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation: infiniteGradient 5s linear infinite;
    }
    @keyframes infiniteGradient{
      0%{ background-position:0% 0%; }
      100%{ background-position:100% 300%; }
    }

    /* Profile container with blur */
    .profile-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px,1fr));
      gap: 10px;
      justify-items: center;
      padding: 50px;
      max-width: 500px;
      margin: 0 auto 50px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      border-radius: 20px;
    }

    .profile {
      --size:110px;
      width:var(--size);
      height:var(--size);
      border-radius:50%;
      background:#111;
      background-size:cover;
      background-position:center;
      position:relative;
      cursor:pointer;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .profile:hover{ transform: translateY(-6px) scale(1.02); }

    .profile img.pfp{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
      display:block;
    }

    /* Status Ring */
    .status-ring{
      position:absolute;
      right:6px;
      bottom:6px;
      width:16px;
      height:16px;
      border-radius:50%;
      border:3px solid rgba(0,0,0,0.6);
      background:#777; /* Default offline */
      pointer-events:none;
    }

    /* Card / Tooltip */
    .card{
      position:absolute;
      left:50%;
      top:0;
      transform: translate(-50%,-150%) translateY(6px);
      min-width:240px;
      max-width:320px;
      padding:12px;
      border-radius:14px;
      background:var(--card-bg);
      backdrop-filter: blur(var(--card-blur));
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity:0;
      pointer-events:none;
      transition: opacity .22s ease, transform .22s ease;
      display:flex;
      gap:12px;
      align-items:flex-start;
      z-index:9999;
    }
    .card.visible{
      opacity:1;
      transform: translate(-50%,-180%) translateY(0);
      pointer-events:auto;
    }
    .card::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-8px;
      transform:translateX(-50%);
      width:12px;
      height:12px;
      background:var(--card-bg);
      clip-path: polygon(50% 0, 0 100%, 100% 100%);
      backdrop-filter: blur(var(--card-blur));
    }

    .card-pfp{
      width:56px;
      height:56px;
      border-radius:50%;
      object-fit:cover;
      background:#222;
      border:2px solid rgba(255,255,255,0.05);
      flex-shrink:0;
    }

    .card-content{ display:flex; flex-direction:column; gap:6px; text-align:left; min-width:0; }
    .name{ font-weight:800; font-size:16px; color:#f0f0f0; line-height:1; }
    .status{ font-size:13px; color:#dcdcdc; display:flex; gap:8px; align-items:center; }
    .custom{ font-size:13px; color:#e8e8e8; opacity:.95; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow: 0 0 8px rgba(0,0,0,0.7); }

  <script>
    // Click to hide enter screen
    document.querySelector('.enter-text').addEventListener('click', () => {
      document.getElementById('enterScreen').style.display = 'none';
    });

    // Show card tooltip on hover
    document.querySelectorAll('.profile').forEach(profile=>{
      const card = profile.querySelector('.card');
      profile.addEventListener('mouseenter', ()=> card.classList.add('visible'));
      profile.addEventListener('mouseleave', ()=> card.classList.remove('visible'));
      profile.setAttribute('tabindex','0');
      profile.addEventListener('focus', ()=> card.classList.add('visible'));
      profile.addEventListener('blur', ()=> card.classList.remove('visible'));
    });
